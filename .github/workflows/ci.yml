name: Validation
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate when called by the release workflow
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      POWERSHELL_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Isolate Claude configuration
        run: printf 'CLAUDE_CONFIG_DIR=%s/aikya-claude-ci\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install the pinned Claude Code test runtime
        run: |
          read -r claude_version < .claude-version
          npm install --global "@anthropic-ai/claude-code@$claude_version"
          claude --version
      - name: Require PowerShell on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-Command pwsh -ErrorAction Stop
      - name: Check shell syntax
        run: for script in install.sh mods/*/install.sh installers/*.sh; do bash -n "$script"; done
      - name: Test installers and release tools
        run: python -m unittest discover -s tests -v
      - name: Validate the marketplace and native mods
        run: |
          claude plugin validate . --strict
          for mod in mods/*; do
            claude plugin validate "$mod" --strict
            claude plugin test "$mod"
          done
      - name: Test real installation in disposable configurations
        run: python tests/integration_install.py
      - name: Build and install the release archive
        run: python tests/integration_package.py
