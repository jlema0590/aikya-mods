name: Flow bridge contract
on:
  push:
    paths:
      - 'mods/aikya-flow/**'
      - 'tests/integration_flow_bridge.py'
      - '.github/workflows/flow-bridge.yml'
  pull_request:
    paths:
      - 'mods/aikya-flow/**'
      - 'tests/integration_flow_bridge.py'
      - '.github/workflows/flow-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          path: mods
          persist-credentials: false
      - name: Check out the matching Harness producer
        uses: actions/checkout@v6
        with:
          repository: jlema0590/aikya-harness
          ref: f5c273c5bf27fc413832f38537f2b7ede3c0aa6b
          path: producer
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify actual CLI snapshots and Flow consumer
        run: python mods/tests/integration_flow_bridge.py producer
